name: Inference catalog drift
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compare public catalogs and report stale sources
        run: pnpm bossraid sync:inference-catalog -- --check
