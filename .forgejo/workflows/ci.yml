name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, development, staging]
  pull_request:
    branches: [main, development, staging]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forgejo-parity:
    name: Forgejo Parity
    runs-on: ubuntu-latest
    container:
      options: --network host
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=critical
      - run: pnpm check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm build:docs
      - run: pnpm test:unit
      - run: pnpm test:money-path
      - run: pnpm test:attestation