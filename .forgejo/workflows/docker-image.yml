# Build + push production images on spectre (native linux/amd64). Never QEMU on laptops.
# Host label has Docker but not Node — avoid actions/checkout (needs node).
name: Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - development
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: spectre
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: boss-raid
            docker_target: runtime
          - image_name: boss-raid-evaluator
            docker_target: evaluator-runtime
          - image_name: boss-raid-evaluator-job
            docker_target: evaluator-job

    steps:
      - name: Checkout (shell)
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/src"
          mkdir -p "$RUNNER_TEMP/src"
          cd "$RUNNER_TEMP/src"
          git init
          git remote add origin "https://x-access-token:${REPO_TOKEN}@forgejo.phantasy.bot/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout --force FETCH_HEAD
          echo "WORKSPACE=$PWD" >> "$GITHUB_ENV"
          pwd
          git rev-parse --short HEAD

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
        run: |
          set -euo pipefail
          if [ -z "${GHCR_TOKEN:-}" ]; then
            echo "GHCR_TOKEN secret missing — set a GitHub PAT with write:packages on the Forgejo repo."
            exit 1
          fi
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GHCR_USERNAME:-thomasjvu}" --password-stdin

      - name: Build and push (native amd64)
        run: |
          set -euo pipefail
          cd "${WORKSPACE}"
          REF="${GITHUB_REF_NAME:-development}"
          SHA="$(git rev-parse --short HEAD)"
          IMAGE="ghcr.io/thomasjvu/${{ matrix.image_name }}"
          TAGS=("${IMAGE}:${REF}" "${IMAGE}:sha-${SHA}")
          if [ "$REF" = "main" ]; then
            TAGS+=("${IMAGE}:latest")
          fi
          TAG_ARGS=()
          for t in "${TAGS[@]}"; do
            TAG_ARGS+=(-t "$t")
          done
          echo "Building ${IMAGE} target=${{ matrix.docker_target }} tags=${TAGS[*]}"
          docker build \
            --platform linux/amd64 \
            --target "${{ matrix.docker_target }}" \
            "${TAG_ARGS[@]}" \
            -f Dockerfile \
            .
          for t in "${TAGS[@]}"; do
            docker push "$t"
          done
