# Build + push production images on spectre (native linux/amd64). Never QEMU on laptops.
# runs-on: spectre must be a HOST runner (real /usr/bin/docker), not the dockerized act-runner image.
name: Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - development
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: spectre
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: boss-raid
            docker_target: runtime
          - image_name: boss-raid-evaluator
            docker_target: evaluator-runtime
          - image_name: boss-raid-evaluator-job
            docker_target: evaluator-job

    steps:
      - name: Checkout (local-first)
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP:-/tmp}/bossraid-src-$$"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          cd "$WORK"

          LOCAL_MIRROR="${BOSSRAID_LOCAL_MIRROR:-$HOME/bossraid-ops/mercenary}"
          if [ -d "$LOCAL_MIRROR/.git" ]; then
            echo "Using local mirror: $LOCAL_MIRROR"
            git clone --shared "$LOCAL_MIRROR" repo
            cd repo
            git fetch --all --tags --force || true
            git checkout --force "$GITHUB_SHA" 2>/dev/null || git checkout --force "origin/$GITHUB_REF_NAME"
          else
            echo "Cloning via Forgejo (prefer loopback)"
            # Host runner can hit local Forgejo without Cloudflare.
            BASE="http://127.0.0.1:3000"
            if ! curl -fsS --max-time 3 "$BASE/api/v1/version" >/dev/null 2>&1; then
              BASE="${GITHUB_SERVER_URL}"
            fi
            git init repo
            cd repo
            git remote add origin "${BASE}/${GITHUB_REPOSITORY}.git"
            # token auth for private repo when not using loopback anonymous (private needs token)
            git -c "http.extraHeader=Authorization: token ${REPO_TOKEN}" \
              fetch --depth 1 origin "$GITHUB_SHA"
            git checkout --force FETCH_HEAD
          fi

          echo "WORKSPACE=$PWD" >> "$GITHUB_ENV"
          git rev-parse --short HEAD
          command -v docker
          docker version --format '{{.Server.Os}}/{{.Server.Arch}}'

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
        run: |
          set -euo pipefail
          if [ -z "${GHCR_TOKEN:-}" ]; then
            echo "GHCR_TOKEN secret missing — set a GitHub PAT with write:packages on the Forgejo repo."
            exit 1
          fi
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GHCR_USERNAME:-thomasjvu}" --password-stdin

      - name: Build and push (native amd64)
        run: |
          set -euo pipefail
          cd "${WORKSPACE}"
          REF="${GITHUB_REF_NAME:-development}"
          SHA="$(git rev-parse --short HEAD)"
          IMAGE="ghcr.io/thomasjvu/${{ matrix.image_name }}"
          TAGS=("${IMAGE}:${REF}" "${IMAGE}:sha-${SHA}")
          if [ "$REF" = "main" ]; then
            TAGS+=("${IMAGE}:latest")
          fi
          TAG_ARGS=()
          for t in "${TAGS[@]}"; do
            TAG_ARGS+=(-t "$t")
          done
          echo "Building ${IMAGE} target=${{ matrix.docker_target }} tags=${TAGS[*]}"
          docker build \
            --platform linux/amd64 \
            --target "${{ matrix.docker_target }}" \
            "${TAG_ARGS[@]}" \
            -f Dockerfile \
            .
          for t in "${TAGS[@]}"; do
            docker push "$t"
          done
