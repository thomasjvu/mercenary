<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">Party Quest provider payout flow</title>
  <desc id="desc">Boss Raid receives x402 buyer funds, selects a Party Quest provider, verifies work, settles to the provider payee wallet, and lets Party Quest mirror receipts into analytics and EXP.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#111" />
    </marker>
    <style>
      .box{fill:#fff;stroke:#111;stroke-width:2}.muted{fill:#f4f4f4;stroke:#111;stroke-width:2}.line{fill:none;stroke:#111;stroke-width:2;marker-end:url(#arrow)}.dash{fill:none;stroke:#111;stroke-width:2;stroke-dasharray:8 7;marker-end:url(#arrow)}.title{fill:#111;font:700 18px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px}.label{fill:#111;font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px}.body{fill:#333;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}.tiny{fill:#555;font:11px ui-monospace,SFMono-Regular,Menlo,monospace}
    </style>
  </defs>
  <rect width="1120" height="640" fill="#fff" />
  <text x="40" y="46" class="title">BOSS RAID x PARTY QUEST PAYOUT LOOP</text>
  <text x="40" y="70" class="tiny">Boss Raid/x402 is settlement source of truth; Party Quest mirrors receipts, analytics, attribution, and EXP.</text>
  <rect x="40" y="115" width="185" height="112" class="box" />
  <text x="62" y="146" class="label">API BUYER</text><text x="62" y="174" class="body">Pays platform via</text><text x="62" y="194" class="body">x402 / PayAI</text><text x="62" y="214" class="tiny">budget + route price</text>
  <rect x="286" y="115" width="190" height="112" class="muted" />
  <text x="310" y="146" class="label">BOSS RAID</text><text x="310" y="174" class="body">Mercenary selects</text><text x="310" y="194" class="body">eligible providers</text><text x="310" y="214" class="tiny">budget, trust, privacy</text>
  <rect x="536" y="115" width="205" height="112" class="box" />
  <text x="560" y="146" class="label">PARTY QUEST PROVIDER</text><text x="560" y="174" class="body">Formation or agent</text><text x="560" y="194" class="body">accepts signed raid</text><text x="560" y="214" class="tiny">runs private quest tree</text>
  <rect x="806" y="115" width="190" height="112" class="muted" />
  <text x="830" y="146" class="label">VERIFICATION</text><text x="830" y="174" class="body">Boss Raid checks</text><text x="830" y="194" class="body">provider result</text><text x="830" y="214" class="tiny">valid/invalid receipt</text>
  <path d="M225 171H276" class="line" /><path d="M476 171H526" class="line" /><path d="M741 171H796" class="line" />
  <rect x="288" y="316" width="230" height="120" class="box" />
  <text x="312" y="347" class="label">PROVIDER SETTLEMENT</text><text x="312" y="375" class="body">Payout releases to the</text><text x="312" y="395" class="body">registered provider payee</text><text x="312" y="415" class="tiny">squad wallet or splitter</text>
  <rect x="588" y="316" width="230" height="120" class="box" />
  <text x="612" y="347" class="label">PARTY QUEST MIRROR</text><text x="612" y="375" class="body">Stores receipt, gross, fees,</text><text x="612" y="395" class="body">cost, net, proof URL</text><text x="612" y="415" class="tiny">does not custody funds</text>
  <rect x="876" y="316" width="190" height="120" class="muted" />
  <text x="900" y="347" class="label">AGENT CREDIT</text><text x="900" y="375" class="body">Awards EXP, completions,</text><text x="900" y="395" class="body">leaderboard stats</text><text x="900" y="415" class="tiny">equal attribution by default</text>
  <path d="M902 227C902 280 403 276 403 306" class="line" /><path d="M518 376H578" class="line" /><path d="M818 376H866" class="line" />
  <rect x="42" y="476" width="416" height="92" class="box" />
  <text x="66" y="508" class="label">FORMATION PAYOUT POLICY</text><text x="66" y="536" class="body">Formation = one Boss Raid provider. Use a splitter wallet for automatic member payouts.</text><text x="66" y="556" class="tiny">Individual agent providers are the direct-wallet path.</text>
  <rect x="524" y="476" width="542" height="92" class="box" />
  <text x="548" y="508" class="label">SELF-HOSTED PARTICIPATION</text><text x="548" y="536" class="body">Self-hosted Party Quest can connect eligible providers to first-party BBS and Boss Raid demand.</text><text x="548" y="556" class="tiny">Selection may require non-private compute, TEE verification, or runtime health evidence.</text>
  <path d="M638 227C638 266 420 272 420 306" class="dash" /><text x="438" y="283" class="tiny">providerRunId + submission</text>
</svg>
