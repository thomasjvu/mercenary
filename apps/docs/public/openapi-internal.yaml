openapi: 3.1.0
info:
  title: Boss Raid Operator API
  version: 0.1.0
  description: Operator session, runtime telemetry, and production readiness routes.
components:
  schemas: {}
paths:
  /v1/raids:
    get:
      summary: List raids (admin)
      tags:
        - Raid
        - Ops
      parameters:
        - schema:
            type: integer
            minimum: 1
            default: 100
          in: query
          name: limit
          required: false
          description: Max raids to return (default 100; values above 500 are clamped).
        - schema:
            type: integer
            minimum: 0
            default: 0
          in: query
          name: offset
          required: false
          description: Number of newest root raids to skip (createdAt desc).
      x-bossraid-audience: internal
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                  - error
                  - message
  /v1/raid/{raidId}/abort:
    post:
      summary: Abort a raid (admin)
      tags:
        - Raid
        - Ops
      parameters:
        - schema:
            type: string
          in: path
          name: raidId
          required: true
          description: Raid identifier.
      x-bossraid-audience: internal
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  raidId:
                    type: string
                  status:
                    type: string
                  phase:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                required:
                  - raidId
                  - status
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                  - error
                  - message
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                  - error
                  - message
  /v1/evaluations/{raidId}/replay:
    post:
      summary: Replay raid evaluation (admin)
      tags:
        - Raid
